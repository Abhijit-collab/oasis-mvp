<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdoptXR Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#14161a;--mute:#6b7280;--line:#e6e8ec;
  --surface2:#fafbfc;--hover:#fafbff;--field:#fff;--on-accent:#fff;
  --side-bg:#0f1729;--side-ink:#cdd5e3;--side-mute:#8b97ad;--side-hover:#1b2540;--side-line:#1f2a45;--side-field:#1b2540;--side-field-line:#2c3858;--side-on:var(--accent);--side-on-ink:#fff;
  --bar:#9fb4f5;--bar-hi:#2f5bea;--grid:#eef0f3;--axis:#8a93a3;--heat-rgb:47,91,234;--heat-ink:#fff;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-display:var(--font);
  --login-bg:#0f1729;--overlay:rgba(15,23,41,.45);
  --accent:#2f5bea;--accent-soft:#e8eefe;
  --hot:#d92d20;--hot-soft:#fdecea;--warm:#c26a00;--warm-soft:#fff3e0;--cold:#5b6b82;--cold-soft:#eef1f5;
  --ok:#15803d;--ok-soft:#e7f6ec;--r:12px;--side:224px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--side-bg);color:var(--side-ink);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 10px 16px}
.brand img{width:150px;display:block}
.side>.projmini{margin:0 4px 16px;background:var(--side-field);border-color:var(--side-field-line);color:var(--side-ink)}
.side>.projmini small{color:var(--side-mute)}
.projmini{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--ink);text-decoration:none}
.projmini:hover{border-color:var(--accent)}
.projmini img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.projmini small{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
.projmini b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projmini>span{min-width:0}
.welcome{margin:2px 0 20px}
.welcome h1{font-family:var(--font-display);font-weight:400;font-size:36px;letter-spacing:-.8px;line-height:1.1;margin:0}
.welcome h1 em{color:var(--accent)}
.welcome p{margin:6px 0 0;color:var(--mute)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:28px}
.pcard{display:block;text-align:left;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,41,.12)}
.pcard .im{position:relative;height:150px;background:#e6e8ec}
.pcard img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .now{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;letter-spacing:.5px;border-radius:999px;padding:4px 10px;display:none}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pcard.on .now{display:inline-block}
.pcard .bd{padding:12px 14px 14px}
.pcard .nm{font-family:var(--font-display);font-size:18px;font-weight:600;margin-bottom:6px}
.pcard .st{display:flex;gap:14px;font-size:12px;color:var(--mute)}
.pcard .st b{color:var(--ink);font-size:14px;margin-right:3px}
.pcard .st .h b{color:var(--hot)}
.mbar{display:none}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none}
.nav a:hover{background:var(--side-hover)}
.nav a.on{background:var(--side-on);color:var(--side-on-ink)}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-mute);padding:10px}
.side .foot button{background:none;border:1px solid var(--side-field-line);color:var(--side-ink);border-radius:8px;padding:6px 10px;margin-top:8px;width:100%}
main{padding:24px 28px 40px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-family:var(--font-display)}
.top .sub{color:var(--mute);font-size:13px}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.card h3 span{color:var(--mute);font-weight:400;font-size:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(5,1fr)}
.two{grid-template-columns:1.4fr 1fr}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px;font-family:var(--font-display)}
.kpi .l{color:var(--mute);font-size:12px}
.kpi .d{font-size:12px;margin-top:2px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c9ced8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dan{color:var(--hot)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.inp{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:8px 10px;min-width:0}
.inp:focus,.btn:focus-visible{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;opacity:.6;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.hot{background:var(--hot-soft);color:var(--hot)}
.pill.warm{background:var(--warm-soft);color:var(--warm)}
.pill.cold{background:var(--cold-soft);color:var(--cold)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.st-not_assigned{background:var(--surface2);color:var(--mute);border:1px dashed var(--mute)}
.st-assigned{background:var(--accent-soft);color:var(--accent)}
.st-active{background:var(--ok-soft);color:var(--ok)}
.st-expired{background:var(--warm-soft);color:var(--warm)}
.st-revoked{background:var(--hot-soft);color:var(--hot)}
.mute{color:var(--mute)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:160px}

/* ---------- list rows (table on desktop, cards on mobile) ---------- */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{background:var(--surface2);color:var(--mute);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.row.click{cursor:pointer}.row.click:hover{background:var(--hover)}
.leads-row{grid-template-columns:2fr 1.1fr 1fr 1fr .8fr .9fr}
.codes-row{grid-template-columns:1.2fr 1fr 1.6fr 1fr 1fr 1.6fr}
.name{font-weight:600}
.cell-sub{font-size:12px;color:var(--mute)}
.lbl{display:none}
.empty{padding:30px;text-align:center;color:var(--mute)}

.fpanel{margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
.fgrid .field{margin-bottom:10px}
.factions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}

/* ---------- charts ---------- */
.funnel .f{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.bar{height:22px;background:var(--accent-soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.funnel .n{text-align:right;font-weight:600}
.mini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.mini.click{cursor:pointer}
.chart svg{width:100%;height:auto;display:block}

/* ---------- units heatmap ---------- */
.units-wrap{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.heat{display:grid;gap:6px}
.heat .fl{display:grid;align-items:center;gap:6px}
.heat .fn{font-size:12px;color:var(--mute);text-align:right;padding-right:4px}
.cellu{border:0;border-radius:8px;padding:8px 4px;font-size:12px;font-weight:600;text-align:center;line-height:1.2;min-height:44px}
.cellu small{display:block;font-weight:400;font-size:11px;opacity:.85}
.cellu.sold{background:repeating-linear-gradient(45deg,var(--line),var(--line) 5px,var(--surface2) 5px,var(--surface2) 10px);color:var(--mute)}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-top:12px;flex-wrap:wrap}
.legend .grad{width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(var(--heat-rgb),.08),rgba(var(--heat-rgb),.93))}
.legend .sw{width:14px;height:10px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--line),var(--line) 3px,var(--surface2) 3px,var(--surface2) 6px)}

/* ---------- drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:41;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer .dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px;z-index:2}
.drawer .db{padding:16px 18px 40px;display:grid;gap:14px}
.x{border:0;background:var(--surface2);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 28px));background:var(--card);border-radius:14px;z-index:41;padding:20px;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 14px;font-size:17px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--mute);font-weight:600}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.score-wrap{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stats b{display:block;font-size:17px}
.stats span{font-size:11px;color:var(--mute)}
.brk{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.brk .bar{height:8px}
.brk .n{text-align:right;color:var(--mute)}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .s{font-size:12px;font-weight:700;color:var(--mute);margin:14px 0 6px -18px;text-transform:uppercase;letter-spacing:.4px}
.tl .s:first-child{margin-top:0}
.tl .e{position:relative;font-size:13px;padding:3px 0}
.tl .e:before{content:"";position:absolute;left:-17px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tl .e.k:before{background:var(--hot)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:13px}

/* ---------- login ---------- */
.login{position:fixed;inset:0;display:grid;grid-template-columns:1.15fr 1fr;background:var(--bg);z-index:80;overflow:auto}
.lg-art{position:relative;overflow:hidden;background:radial-gradient(900px 600px at 20% 0%,#2f5bea 0%,#16307f 45%,#0f1729 100%);color:#fff;display:flex;flex-direction:column;padding:56px 56px 0}
.lg-art:after{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 70% 95%,rgba(127,166,255,.25),transparent 70%);pointer-events:none}
.lg-copy{position:relative;z-index:1;max-width:460px}
.lg-kicker{display:inline-block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#cfdcff;border:1px solid rgba(207,220,255,.4);border-radius:999px;padding:6px 12px}
.lg-art h1{font-family:var(--font-display);font-weight:400;font-size:46px;line-height:1.05;letter-spacing:-1px;margin:22px 0 14px}
.lg-art h1 em{color:#9fb4f5}
.lg-art p{margin:0;color:#c9d4f5;font-size:15px;max-width:380px}
.lg-tower{position:relative;z-index:1;margin-top:auto;width:100%;height:auto;max-height:58vh;display:block}
.lg-tower .w{fill:#dbe5ff;opacity:.12}
.lg-tower .w.on{opacity:.9;animation:lgGlow 4s ease-in-out infinite}
@keyframes lgGlow{0%,100%{opacity:.9}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lg-tower .w.on{animation:none}}
.lg-side{display:grid;place-items:center;padding:32px 24px}
.login .lf{width:min(380px,100%);background:none;border:0;box-shadow:none;padding:0}
.lg-logo{width:150px;display:block;margin:0 0 36px}
.login h2{font-family:var(--font-display);font-weight:400;font-size:34px;letter-spacing:-.6px;margin:0 0 6px}
.login .lf p{margin:0 0 26px;color:var(--mute);font-size:14px}
.lg-lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.lg-pw{position:relative}
.lg-pw .inp{width:100%;padding:13px 70px 13px 16px;font-size:15px}
.lg-pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.login .err{color:var(--hot);font-size:12px;min-height:18px;margin-top:6px}
.lg-btn{width:100%;justify-content:center;padding:13px 16px;font-size:15px;font-weight:600;margin-top:4px}
.lg-btn span{transition:transform .2s}.lg-btn:hover span{transform:translateX(3px)}
.login .lf .lg-hint{margin:22px 0 0;font-size:12px;text-align:center}
@media (max-width:860px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .lg-art{padding:28px 22px 0;min-height:300px}
  .lg-art h1{font-size:30px;margin:14px 0 8px}
  .lg-art p{font-size:13px}
  .lg-tower{max-height:150px;margin-top:18px}
  .lg-side{place-items:start center;padding:28px 22px 40px}
  .lg-logo{margin-bottom:22px;width:130px}
  .login h2{font-size:28px}
}


/* =====================================================================
   DESIGN — Ivory Luxe
   ===================================================================== */
.app{position:relative;z-index:1}

/* ---------- Final design: Classic blue & white colours, serif headings ---------- */
body{--font:Inter,system-ui,sans-serif;--font-display:Fraunces,Georgia,serif;--login-bg:var(--bg);--r:16px}
.top h1{font-weight:400;font-size:32px;letter-spacing:-.6px}
.kpi .v{font-weight:400;font-size:36px;letter-spacing:-1px}
.kpi .l{text-transform:uppercase;letter-spacing:.8px;font-size:11px}
.card h3{font-family:var(--font-display);font-size:17px;font-weight:600}
.drawer .name[style]{font-family:var(--font-display);font-size:20px!important;font-weight:600}
.btn,.chip,.inp{border-radius:999px}
textarea.inp{border-radius:14px}
.nav a.on{border-radius:999px}
.modal h2{font-family:var(--font-display);font-weight:600}

/* ---------- mobile ---------- */
@media (max-width:1100px){.fgrid{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}.two,.units-wrap{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around}
  .brand,.side>.projmini,.side .foot{display:none}
  .mbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:-2px 0 14px}
  .mbar>img{width:112px;margin-right:auto}
  .mbar .projmini{padding:5px 10px 5px 5px;max-width:58%}
  .mbar .projmini img{width:30px;height:30px;border-radius:8px}
  .welcome h1{font-size:28px}
  .pcards{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:72%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:14px;margin:0 -14px 22px;padding:4px 14px 8px}
  .pcard{scroll-snap-align:start}
  .pcard .im{height:130px}
  .nav{display:contents}
  .nav a{flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;flex:1;justify-content:center;border-radius:10px}
  main{padding:16px 14px 90px}
  .top h1{font-size:19px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .v{font-size:22px}
  .row.head{display:none}
  .leads-row,.codes-row{grid-template-columns:1fr 1fr;gap:6px 12px;padding:14px}
  .leads-row>:first-child,.codes-row>:first-child{grid-column:1/-1}
  .codes-row>:last-child{grid-column:1/-1}
  .lbl{display:block;font-size:11px;color:var(--mute)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr 1fr}
  .funnel .f{grid-template-columns:96px 1fr 40px}
  .heat .cellu{padding:6px 2px;min-height:40px;font-size:11px}
  .heat .cellu small{display:none}
  .toast{bottom:84px}
}
</style>
</head>
<body>

<!-- ===== Login (dummy) ===== -->
<div class="login" id="login">
  <section class="lg-art" aria-hidden="true">
    <div class="lg-copy">
      <span class="lg-kicker">AdoptXR Analytics</span>
      <h1>Every buyer's journey,<br><em>at a glance.</em></h1>
      <p>See who explored which unit, for how long, and who is ready for a call.</p>
    </div>
    <svg class="lg-tower" id="lgTower"></svg>
  </section>
  <section class="lg-side">
    <div class="lf" id="loginForm">
      <img data-logo="page" alt="AdoptXR" class="lg-logo">
      <h2>Welcome back</h2>
      <p>Enter the dashboard password to continue.</p>
      <label class="lg-lbl" for="pw">Password</label>
      <div class="lg-pw">
        <input class="inp" id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" id="pwEye" aria-label="Show password">Show</button>
      </div>
      <div class="err" id="pwErr"></div>
      <button type="button" class="btn pri lg-btn" id="loginBtn">Sign in <span aria-hidden="true">→</span></button>
      <p class="lg-hint">Mock-up password: <b class="mono">demo123</b></p>
    </div>
  </section>
</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand"><img data-logo="side" alt="AdoptXR"></div>
    <a class="projmini" href="#overview" id="projMini" title="Change project on Overview"></a>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div id="footProj"></div><button id="logout">Sign out</button></div>
  </aside>
  <main>
    <div class="mbar"><img data-logo="page" alt="AdoptXR"><a class="projmini" href="#overview" id="projMiniM"></a></div>
    <div id="main"></div>
  </main>
</div>

<div id="layer"></div>
<div id="errBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#d92d20;color:#fff;padding:10px 14px;font:13px/1.4 monospace"></div>
<script>window.onerror=function(m,src,l,c){var b=document.getElementById('errBar');b.style.display='block';b.textContent='Script error: '+m+' (line '+l+')';};</script>

<script>
/* =====================================================================
   CONFIG — edit here. Everything below reads from these constants.
   ===================================================================== */
const CONFIG = {

const DAY = 864e5, NOW = Date.now();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(CONFIG.DEMO.SEED);
const rint = (a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick = a=>a[Math.floor(rnd()*a.length)];

function makeCode(rand){
  const A = CONFIG.CODE_ALPHABET; let s = '';
  for (let i=0;i<CONFIG.CODE_LENGTH;i++) s += A[Math.floor(rand()*A.length)];
  return s.match(new RegExp('.{1,'+CONFIG.CODE_GROUP+'}','g')).join('-');
}
function secureRand(){ const b=new Uint32Array(1); crypto.getRandomValues(b); return b[0]/4294967296; }

const FIRST = ['Aarav','Vihaan','Ananya','Diya','Rohan','Ishaan','Kavya','Meera','Arjun','Saanvi','Kabir','Neha','Siddharth','Pooja','Rajesh','Sunita','Vikram','Anjali','Nikhil','Ritu'];
const LAST  = ['Sharma','Patil','Iyer','Desai','Kulkarni','Mehta','Nair','Joshi','Shah','Reddy'];

let CUR, TOWERS, UNITS, UNIT_BY_ID, AVAILABLE, CODES, EVENTS;
//  CODES:  { code, status, customer:{name,phone}, handler, createdAt, assignedAt, firstLoginAt, expiresAt, stage, notes }
//  EVENTS: { code, sid, ts, type, unit?, dur?, device }
const DB = {};

function buildProject(p){
  TOWERS = p.towers; UNITS = []; CODES = []; EVENTS = [];
  TOWERS.forEach(t=>{
    for (let f=1; f<=t.floors; f++) t.types.forEach((type,i)=>{
      UNITS.push({ id:`${t.id}-${f}${String(i+1).padStart(2,'0')}`, tower:t.id, floor:f, idx:i+1, type,
        priceCr:+(t.basePriceCr+(f-1)*t.floorRiseCr+(t.typeAddCr[type]||0)).toFixed(2), sold:rnd()<0.28 });
    });
  });
  UNIT_BY_ID = Object.fromEntries(UNITS.map(u=>[u.id,u]));
  AVAILABLE = UNITS.filter(u=>!u.sold);
  seed(p.demoCodes);
  DB[p.id] = { TOWERS, UNITS, UNIT_BY_ID, AVAILABLE, CODES, EVENTS };
}

function seed(nCodes){
  const D = CONFIG.DEMO;
  for (let i=0;i<nCodes;i++){
    const r = rnd();
    const status = r<.2?'not_assigned':r<.33?'assigned':r<.9?'active':r<.95?'expired':'revoked';
    const createdAt = NOW - rint(1,D.DAYS)*DAY - rint(0,DAY);
    const c = { code:makeCode(rnd), status, customer:null, handler:null, createdAt, assignedAt:null, firstLoginAt:null, expiresAt:null, stage:'New', notes:'' };
    if (status!=='not_assigned'){
      c.customer = { name:`${pick(FIRST)} ${pick(LAST)}`, phone:`+91 9${rint(100000000,999999999)}` };
      c.handler = pick(HANDLERS);
      c.assignedAt = Math.min(NOW-DAY/4, createdAt + rint(0,2)*DAY);
      c.expiresAt = c.assignedAt + CONFIG.DEFAULT_EXPIRY_DAYS*DAY;
      if (status==='expired') c.expiresAt = NOW - rint(1,4)*DAY;
    }
    if (status==='active' || status==='expired') seedEvents(c);
    CODES.push(c);
  }
  EVENTS.sort((a,b)=>a.ts-b.ts);
}
PROJECTS.forEach(buildProject);

function seedEvents(c){
  const intent = rnd();                        // hidden "true" buying intent for the demo
  const start = c.assignedAt + rint(1,20)*36e5;
  const end = c.status==='expired' ? c.expiresAt : NOW;
  if (start>=end) return;
  c.firstLoginAt = start;
  const fav = Array.from({length:rint(2,4)},()=>pick(AVAILABLE).id);
  const device = rnd()<.68?'Mobile':'Desktop';
  const nSess = 1 + Math.floor(intent*rint(2,8));
  let times = [start];
  for (let s=1;s<nSess;s++){ // high intent → sessions skew recent
    const t = start + (end-start)*Math.pow(rnd(), 1-intent*0.7);
    times.push(t);
  }
  times.sort((a,b)=>a-b);
  let enquired = false;
  times.forEach((t0,si)=>{
    const sid = c.code+'#'+si; let t = t0;
    const ev = (type,extra={})=>{ t += rint(15,90)*1e3; EVENTS.push({code:c.code,sid,ts:t,type,device,...extra}); };
    let sessDur = 0;
    const startIdx = EVENTS.length; ev('session_start',{dur:0});
    if (rnd()<.5) ev('filter_used');
    for (let k=rint(1,5);k>0;k--){
      const unit = rnd()<.7?pick(fav):pick(AVAILABLE).id;
      const dur = Math.round(rint(20,200)*(0.5+intent)); sessDur += dur;
      ev('unit_view',{unit,dur});
      if (rnd()<.35+intent*.4){ const d=Math.round(rint(30,160)*(0.4+intent)); sessDur+=d; ev('view_360',{unit,dur:d}); }
      if (rnd()<intent*.8) ev('price_view',{unit});
    }
    if (rnd()<intent*.35) ev('unit_compare');
    if (rnd()<intent*.3) ev('brochure_download');
    if (!enquired && intent>.65 && rnd()<.4){ enquired=true; ev('enquiry_submit',{unit:fav[0]}); }
    EVENTS[startIdx].dur = sessDur + rint(30,180);
  });
  if (enquired) c.stage = pick(['Contacted','Site visit','Negotiation']);
}

const byCode = () => { const m={}; EVENTS.forEach(e=>(m[e.code]=m[e.code]||[]).push(e)); return m; };

function useProject(id){

function leadStats(code){
  const ev = EV_BY_CODE[code]||[];
  const starts = ev.filter(e=>e.type==='session_start');
  const dwell = {};
  ev.forEach(e=>{ if((e.type==='unit_view'||e.type==='view_360')&&e.unit) dwell[e.unit]=(dwell[e.unit]||0)+e.dur; });
  const top = Object.entries(dwell).sort((a,b)=>b[1]-a[1]);
  let quickReturn = 0;
  for (let i=1;i<starts.length;i++) if (starts[i].ts-starts[i-1].ts < 2*DAY) quickReturn++;
  const cnt = t=>ev.filter(e=>e.type===t).length;
  const devices = {}; starts.forEach(s=>devices[s.device]=(devices[s.device]||0)+1);
  return {
    sessions: starts.length,
    totalSec: starts.reduce((a,s)=>a+s.dur,0),
    lastSeen: ev.length?ev[ev.length-1].ts:null,
    device: (Object.entries(devices).sort((a,b)=>b[1]-a[1])[0]||['—'])[0],
    topUnits: top.slice(0,5),
    topUnitMin: top.length?Math.floor(top[0][1]/60):0,
    priceViews: cnt('price_view'), v360: cnt('view_360'), brochure: cnt('brochure_download'),
    compare: cnt('unit_compare'), enquiry: cnt('enquiry_submit'), quickReturn, events: ev
  };
}
function scoreOf(st){
  if (!st.sessions) return { total:0, parts:SCORE_RULES.map(r=>({...r,pts:0})), factor:1 };
  const parts = SCORE_RULES.map(r=>({ ...r, pts:Math.min(r.max,(st[r.key]||0)*r.per) }));
  const days = (NOW-st.lastSeen)/DAY;
  const factor = Math.max(RECENCY.floor, 1 - Math.max(0,days-RECENCY.graceDays)*RECENCY.decayPerDay);
  const maxSum = SCORE_RULES.reduce((a,r)=>a+r.max,0);            // normalise to 0–100
  const total = Math.round(parts.reduce((a,p)=>a+p.pts,0)/maxSum*100*factor);
  return { total, parts, factor };
}
const bandOf = s => BANDS.find(b=>s>=b.min);

function leads(){
  return CODES.filter(c=>c.customer).map(c=>{ const st=leadStats(c.code); const sc=scoreOf(st); return {c,st,sc,band:bandOf(sc.total)}; });
}

function barChart(counts,today0,days){
  const W=560,H=180,P={l:26,r:6,t:10,b:22}, max=Math.max(4,...counts), bw=(W-P.l-P.r)/days;
  const ticks=[0,Math.round(max/2),max];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visits per day">
    ${ticks.map(t=>{const y=P.t+(H-P.t-P.b)*(1-t/max);return `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" style="stroke:var(--grid)"/><text x="${P.l-6}" y="${y+4}" font-size="10" style="fill:var(--axis)" text-anchor="end">${t}</text>`}).join('')}
    ${counts.map((c,i)=>{const h=(H-P.t-P.b)*c/max, x=P.l+i*bw+bw*.18, y=H-P.b-h, d=new Date(today0-(days-1-i)*DAY);
      return `<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,1)}" rx="3" style="fill:var(${i===days-1?'--bar-hi':'--bar'})"><title>${d.toDateString()}: ${c}</title></rect>
      ${i%2===(days-1)%2?`<text x="${x+bw*.32}" y="${H-6}" font-size="10" style="fill:var(--axis)" text-anchor="middle">${d.getDate()}</text>`:''}`}).join('')}
  </svg>`;
}

const LF_DEFAULTS = JSON.stringify({ ...leadFilter, q:'' });

function interestOf(l){                     // derived from the unit the buyer spent most time on
  const id = l.st.topUnits[0] && l.st.topUnits[0][0]; const u = id && UNIT_BY_ID[id];
  return u ? { type:u.type, tower:u.tower, priceCr:u.priceCr } : null;
}
function signalsOf(l){
  const daysLeft = l.c.expiresAt ? (l.c.expiresAt-NOW)/DAY : Infinity;
  return {
    enquired: l.st.enquiry>0, brochure: l.st.brochure>0, price: l.st.priceViews>0, returning: l.st.quickReturn>0,
    notLogged: !l.c.firstLoginAt, expiring: l.c.status!=='revoked' && daysLeft>=0 && daysLeft<=LEAD_FILTERS.EXPIRING_DAYS
  };
}
function activeCount(){
  let n = 0; ['handler','stage','active','config','budget','tower','device'].forEach(k=>{ if(leadFilter[k]!=='all') n++; });
  return n + leadFilter.signals.length;
}
const opt = (key,val,label)=>`<option value="${esc(val)}" ${leadFilter[key]===val?'selected':''}>${esc(label)}</option>`;
const sel = (key,label,options)=>`<div class="field"><label>${label}</label><select class="inp" data-f="${key}">${options}</select></div>`;

function renderLeads(){
  const L = leads();
  const count = k=>k==='all'?L.length:L.filter(l=>l.band.key===k).length;
  const types = [...new Set(TOWERS.flatMap(t=>t.types))].sort();
  const n = activeCount();
  $('#main').innerHTML = `
    <div class="top"><div><h1>Leads</h1><div class="sub">Find who to call next</div></div></div>
    <div class="toolbar">
      <div class="chips" id="bandChips">${['all',...BANDS.map(b=>b.key)].map(k=>`<button class="chip ${leadFilter.band===k?'on':''}" data-band="${k}">${k==='all'?'All':BANDS.find(b=>b.key===k).label}<b>${count(k)}</b></button>`).join('')}</div>
      <input class="inp grow" id="lq" placeholder="Search name or code" value="${esc(leadFilter.q)}">
      <button class="btn" id="fToggle">Filters${n?` <span class="pill" style="background:var(--accent);color:var(--on-accent)">${n}</span>`:''} ${filtersOpen?'▴':'▾'}</button>
    </div>
    <div class="card fpanel ${filtersOpen?'':'hidden'}" id="fPanel">
      <div class="fgrid">
        ${sel('handler','Handler', opt('handler','all','All handlers')+HANDLERS.map(h=>opt('handler',h,h)).join(''))}
        ${sel('stage','Stage', opt('stage','all','All stages')+STAGES.map(s=>opt('stage',s,s)).join(''))}
        ${sel('active','Last active', opt('active','all','Any time')+LEAD_FILTERS.LAST_ACTIVE.map(a=>opt('active',a.key,a.label)).join(''))}
        ${sel('config','Interested in', opt('config','all','Any configuration')+types.map(t=>opt('config',t,t)).join(''))}
        ${sel('budget','Budget (top unit)', opt('budget','all','Any budget')+LEAD_FILTERS.BUDGET_CR.map(b=>opt('budget',b.key,b.label)).join(''))}
        ${sel('tower','Tower', opt('tower','all','Any tower')+TOWERS.map(t=>opt('tower',t.id,t.name)).join(''))}
        ${sel('device','Device', opt('device','all','Any device')+['Mobile','Desktop'].map(d=>opt('device',d,d)).join(''))}
        ${sel('sort','Sort by', LEAD_FILTERS.SORTS.map(s=>opt('sort',s.key,s.label)).join(''))}
      </div>
      <div class="field" style="margin:4px 0 0"><label>Buyer signals (all must match)</label>
        <div class="chips" id="sigChips">${LEAD_FILTERS.SIGNALS.map(s=>`<button class="chip ${leadFilter.signals.includes(s.key)?'on':''}" data-sig="${s.key}">${s.label}</button>`).join('')}</div>
      </div>
      <div class="factions"><span class="mute" id="fCount"></span><button class="btn sm" id="fClear">Clear filters</button></div>
    </div>
    <div class="list" id="leadList"></div>`;
  drawLeadList(L);
  $('#bandChips').onclick = e=>{ const b=e.target.closest('[data-band]'); if(!b) return; leadFilter.band=b.dataset.band; renderLeads(); };
  $('#lq').oninput = e=>{ leadFilter.q=e.target.value; drawLeadList(L); };
  $('#fToggle').onclick = ()=>{ filtersOpen=!filtersOpen; renderLeads(); };
  $('#fPanel').onchange = e=>{ const k=e.target.dataset.f; if(k){ leadFilter[k]=e.target.value; renderLeads(); } };
  $('#sigChips').onclick = e=>{ const b=e.target.closest('[data-sig]'); if(!b) return; const k=b.dataset.sig, s=leadFilter.signals;
    leadFilter.signals = s.includes(k)?s.filter(x=>x!==k):[...s,k]; renderLeads(); };
  $('#fClear').onclick = ()=>{ Object.assign(leadFilter, JSON.parse(LF_DEFAULTS), { q:leadFilter.q, band:leadFilter.band }); renderLeads(); };
}

function drawLeadList(L){
  const f = leadFilter, q = f.q.trim().toLowerCase();
  const act = LEAD_FILTERS.LAST_ACTIVE.find(a=>a.key===f.active);
  const bud = LEAD_FILTERS.BUDGET_CR.find(b=>b.key===f.budget);
  const rows = L.map(l=>({ ...l, int:interestOf(l), sig:signalsOf(l) })).filter(l=>{
    if (f.band!=='all' && l.band.key!==f.band) return false;
    if (f.handler!=='all' && l.c.handler!==f.handler) return false;
    if (f.stage!=='all' && l.c.stage!==f.stage) return false;
    if (f.device!=='all' && l.st.device!==f.device) return false;
    if (act){ if(!l.st.lastSeen) return false; const d=(NOW-l.st.lastSeen)/DAY;
      if (act.maxDays!=null && d>act.maxDays) return false; if (act.minDays!=null && d<act.minDays) return false; }
    if (f.config!=='all' && (!l.int || l.int.type!==f.config)) return false;
    if (f.tower!=='all' && (!l.int || l.int.tower!==f.tower)) return false;
    if (bud && (!l.int || l.int.priceCr<bud.min || l.int.priceCr>=bud.max)) return false;
    if (f.signals.some(k=>!l.sig[k])) return false;
    if (q && !(l.c.customer.name+l.c.customer.phone+l.c.code).toLowerCase().includes(q)) return false;
    return true;
  });
  const SORT_FN = {
    score:  (a,b)=>b.sc.total-a.sc.total || (b.st.lastSeen||0)-(a.st.lastSeen||0),
    recent: (a,b)=>(b.st.lastSeen||0)-(a.st.lastSeen||0),
    time:   (a,b)=>b.st.totalSec-a.st.totalSec,
    newest: (a,b)=>(b.c.assignedAt||0)-(a.c.assignedAt||0),
    expiry: (a,b)=>(a.c.expiresAt||Infinity)-(b.c.expiresAt||Infinity)
  };
  rows.sort(SORT_FN[f.sort]);
  const fc = $('#fCount'); if (fc) fc.textContent = `${rows.length} of ${L.length} leads`;
  $('#leadList').innerHTML = `<div class="row head leads-row"><span>Buyer</span><span>Handler</span><span>Last seen</span><span>Visits / time</span><span>Stage</span><span>Score</span></div>`
    + (rows.length ? rows.map(l=>`
    <div class="row leads-row click" data-lead="${l.c.code}">
      <div><div class="name">${esc(l.c.customer.name)}</div><div class="cell-sub mono">${l.c.code}</div>
        ${l.int?`<div class="cell-sub">Likes ${l.int.type} · Tower ${l.int.tower} · ₹${l.int.priceCr} Cr</div>`:''}</div>
      <div><span class="lbl">Handler</span>${esc(l.c.handler)}</div>
      <div><span class="lbl">Last seen</span>${ago(l.st.lastSeen)}</div>
      <div><span class="lbl">Visits / time</span>${l.st.sessions} · ${fmtDur(l.st.totalSec)}</div>
      <div><span class="lbl">Stage</span>${esc(l.c.stage)}</div>
      <div><span class="lbl">Score</span>${l.st.sessions?scorePill(l.sc.total,l.band):'<span class="mute cell-sub">Not logged in</span>'}</div>
    </div>`).join('') : '<div class="empty">No leads match these filters</div>');
}

function openLead(code){
  const c = CODES.find(x=>x.code===code); if(!c||!c.customer) return;
  const st = leadStats(code), sc = scoreOf(st), b = bandOf(sc.total);
  const R=36, C=2*Math.PI*R, color=`var(--${b.key})`;
  const sessions = {}; st.events.forEach(e=>(sessions[e.sid]=sessions[e.sid]||[]).push(e));
  const sessList = Object.values(sessions).reverse().slice(0,8);
  openLayer(`
    <div class="dh"><button class="x" data-close aria-label="Close">×</button>
      <div style="flex:1;min-width:0"><div class="name" style="font-size:16px">${esc(c.customer.name)}</div><div class="cell-sub mono">${c.code} · ${tag(c.status)}</div></div>
      <a class="btn sm" href="tel:${esc(c.customer.phone.replace(/\s/g,''))}">Call</a>
    </div>
    <div class="db">
      <div class="card score-wrap">
        <svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${R}" fill="none" style="stroke:var(--grid)" stroke-width="8"/>
          <circle cx="42" cy="42" r="${R}" fill="none" style="stroke:${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*sc.total/100} ${C}" transform="rotate(-90 42 42)"/>
          <text x="42" y="47" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--ink)">${sc.total}</text></svg>
        <div><div style="margin-bottom:4px">${st.sessions?pill(b):'<span class="mute">No activity yet</span>'}</div>
          <div class="cell-sub">Purchase probability score</div>
          <div class="cell-sub">${esc(c.customer.phone)} · ${esc(c.handler)}</div>
          ${sc.factor<1?`<div class="cell-sub">Recency penalty ×${sc.factor.toFixed(2)}</div>`:''}</div>
      </div>
      <div class="stats">
        <div><b>${st.sessions}</b><span>Visits</span></div>
        <div><b>${fmtDur(st.totalSec)}</b><span>Total time</span></div>
        <div><b>${ago(st.lastSeen)}</b><span>Last seen</span></div>
        <div><b>${st.device}</b><span>Device</span></div>
      </div>
      <div class="card"><h3>Follow-up</h3>
        <div class="field"><label>Stage</label><select class="inp" id="stageSel">${STAGES.map(s=>`<option ${c.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label>Notes</label><textarea class="inp" id="notes" rows="3" placeholder="Call notes, budget, preferences…">${esc(c.notes)}</textarea></div>
        <div class="actions"><button class="btn pri sm" id="saveLead">Save</button></div>
      </div>
      <div class="card"><h3>Interested units <span>by time spent</span></h3>
        ${st.topUnits.length?st.topUnits.map(([id,s])=>{const u=UNIT_BY_ID[id];return `<div class="mini click" data-unit="${id}"><div><div class="name">${id}</div><div class="cell-sub">${u.type} · ₹${u.priceCr} Cr${u.sold?' · Sold':''}</div></div><b>${fmtDur(s)}</b></div>`}).join(''):'<div class="empty">—</div>'}
      </div>
      <div class="card"><h3>Why this score</h3>
        ${sc.parts.map(p=>`<div class="brk"><span>${p.label}</span><div class="bar"><i style="width:${p.pts/p.max*100}%"></i></div><span class="n">${p.pts}/${p.max}</span></div>`).join('')}
      </div>
      <div class="card"><h3>Activity <span>last ${sessList.length} visits</span></h3>
        ${sessList.length?`<div class="tl">${sessList.map(s=>`<div class="s">${fmtDT(s[0].ts)} · ${fmtDur(s[0].dur)} · ${s[0].device}</div>`+
          s.filter(e=>e.type!=='session_start').map(e=>`<div class="e ${KEY_EVENTS.includes(e.type)?'k':''}">${EVENT_LABELS[e.type]} ${e.unit?`<b>${e.unit}</b>`:''} ${e.dur?`<span class="mute">· ${fmtDur(e.dur)}</span>`:''}</div>`).join('')).join('')}</div>`:'<div class="empty">Code assigned but not used yet</div>'}
      </div>
    </div>`);
  $('#saveLead').onclick = ()=>{ c.stage=$('#stageSel').value; c.notes=$('#notes').value; toast('Saved'); route(); };
}

/* =====================================================================
   UNITS HEATMAP
   ===================================================================== */
let unitTower = '';
function renderUnits(){
  const t = TOWERS.find(x=>x.id===unitTower);
  const views = {}, leadsByUnit = {};
  EVENTS.forEach(e=>{ if(e.type==='unit_view'){ views[e.unit]=(views[e.unit]||0)+1; (leadsByUnit[e.unit]=leadsByUnit[e.unit]||new Set()).add(e.code); } });
  const max = Math.max(1,...UNITS.filter(u=>u.tower===t.id).map(u=>views[u.id]||0));
  const cols = t.types.length;
  const floors = Array.from({length:t.floors},(_,i)=>t.floors-i);
  const hotAvail = AVAILABLE.map(u=>[u,views[u.id]||0]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  $('#main').innerHTML = `
    <div class="top"><div><h1>Unit demand</h1><div class="sub">Views per unit — use for pricing and inventory push</div></div></div>
    <div class="toolbar"><div class="chips" id="towerChips">${TOWERS.map(x=>`<button class="chip ${x.id===t.id?'on':''}" data-t="${x.id}">${x.name}</button>`).join('')}</div></div>
    <div class="units-wrap">
      <div class="card">
        <div class="heat">
          <div class="fl" style="grid-template-columns:34px repeat(${cols},1fr)"><span></span>${t.types.map((ty,i)=>`<span class="fn" style="text-align:center">${String(i+1).padStart(2,'0')} · ${ty}</span>`).join('')}</div>
          ${floors.map(f=>`<div class="fl" style="grid-template-columns:34px repeat(${cols},1fr)"><span class="fn">F${f}</span>${
            t.types.map((_,i)=>{ const u=UNIT_BY_ID[`${t.id}-${f}${String(i+1).padStart(2,'0')}`]; const v=views[u.id]||0; const k=v/max;
              return u.sold?`<button class="cellu sold" data-unit="${u.id}">Sold</button>`
                :`<button class="cellu" data-unit="${u.id}" style="background:rgba(var(--heat-rgb),${(.08+.85*k).toFixed(2)});color:${k>.55?'var(--heat-ink)':'var(--ink)'}">${v}<small>${(n=>n+' buyer'+(n===1?'':'s'))(leadsByUnit[u.id]?leadsByUnit[u.id].size:0)}</small></button>`;}).join('')
          }</div>`).join('')}
        </div>
        <div class="legend"><span>Fewer views</span><span class="grad"></span><span>More views</span><span class="sw" style="margin-left:10px"></span><span>Sold</span></div>
      </div>
      <div class="card"><h3>Most wanted — still available</h3>
        ${hotAvail.map(([u,v])=>`<div class="mini click" data-unit="${u.id}"><div><div class="name">${u.id}</div><div class="cell-sub">${u.type} · ₹${u.priceCr} Cr</div></div><b>${v} views</b></div>`).join('')}
      </div>
    </div>`;
  $('#towerChips').onclick = e=>{ const b=e.target.closest('[data-t]'); if(b){ unitTower=b.dataset.t; renderUnits(); } };
}
function openUnit(id){
  const u = UNIT_BY_ID[id];
  const ev = EVENTS.filter(e=>e.unit===id && (e.type==='unit_view'||e.type==='view_360'));
  const views = ev.filter(e=>e.type==='unit_view').length;
  const avg = ev.length?Math.round(ev.reduce((a,e)=>a+e.dur,0)/ev.length):0;
  const codes = [...new Set(ev.map(e=>e.code))];
  const L = leads().filter(l=>codes.includes(l.c.code)).sort((a,b)=>b.sc.total-a.sc.total);
  openLayer(`
    <div class="dh"><button class="x" data-close aria-label="Close">×</button>
      <div style="flex:1"><div class="name" style="font-size:16px">Unit ${id}</div><div class="cell-sub">${u.type} · Floor ${u.floor} · ₹${u.priceCr} Cr · ${u.sold?'Sold':'Available'}</div></div></div>
    <div class="db">
      <div class="stats"><div><b>${views}</b><span>Views</span></div><div><b>${codes.length}</b><span>Buyers</span></div><div><b>${fmtDur(avg)}</b><span>Avg. time</span></div><div><b>${EVENTS.filter(e=>e.unit===id&&e.type==='price_view').length}</b><span>Price checks</span></div></div>
      <div class="card"><h3>Interested buyers</h3>
        ${L.length?L.map(l=>`<div class="mini click" data-lead="${l.c.code}"><div><div class="name">${esc(l.c.customer.name)}</div><div class="cell-sub">${esc(l.c.handler)} · seen ${ago(l.st.lastSeen)}</div></div>${scorePill(l.sc.total,l.band)}</div>`).join(''):'<div class="empty">No views yet</div>'}
      </div>
    </div>`);
}

/* =====================================================================
   ACCESS CODES
   ===================================================================== */
const codeFilter = { status:'all', q:'' };
function renderCodes(){
  const count = s=>s==='all'?CODES.length:CODES.filter(c=>c.status===s).length;
  $('#main').innerHTML = `
    <div class="top"><div><h1>Access codes</h1><div class="sub">Generate, assign to a buyer, revoke</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <input class="inp" id="genN" type="number" min="1" max="${CONFIG.MAX_GENERATE}" value="5" style="width:70px" aria-label="How many">
        <button class="btn pri" id="genBtn">+ Generate codes</button>
      </div></div>
    <div class="toolbar">
      <div class="chips" id="stChips">${['all',...Object.keys(STATUS)].map(s=>`<button class="chip ${codeFilter.status===s?'on':''}" data-st="${s}">${s==='all'?'All':STATUS[s]}<b>${count(s)}</b></button>`).join('')}</div>
      <input class="inp grow" id="cq" placeholder="Search code, buyer or handler" value="${esc(codeFilter.q)}">
    </div>
    <div class="list" id="codeList"></div>`;
  drawCodeList();
  $('#stChips').onclick = e=>{ const b=e.target.closest('[data-st]'); if(b){ codeFilter.status=b.dataset.st; renderCodes(); } };
  $('#cq').oninput = e=>{ codeFilter.q=e.target.value; drawCodeList(); };
  $('#genBtn').onclick = ()=>{
    const n = Math.min(CONFIG.MAX_GENERATE, Math.max(1, parseInt($('#genN').value)||1));
    const existing = new Set(PROJECTS.flatMap(p=>DB[p.id].CODES.map(c=>c.code)));
    for (let i=0;i<n;i++){ let code; do code=makeCode(secureRand); while(existing.has(code)); existing.add(code);
      CODES.unshift({ code, status:'not_assigned', customer:null, handler:null, createdAt:Date.now(), assignedAt:null, firstLoginAt:null, expiresAt:null, stage:'New', notes:'' }); }
    codeFilter.status='not_assigned'; renderCodes(); toast(`${n} code${n>1?'s':''} generated`);
  };
}
function drawCodeList(){
  const q = codeFilter.q.trim().toLowerCase();
  const rows = CODES.filter(c=>(codeFilter.status==='all'||c.status===codeFilter.status)
    && (!q || (c.code+(c.customer?c.customer.name:'')+(c.handler||'')).toLowerCase().includes(q)));
  $('#codeList').innerHTML = `<div class="row head codes-row"><span>Code</span><span>Status</span><span>Buyer</span><span>Created</span><span>Expires</span><span></span></div>`
   + (rows.length ? rows.map(c=>`
    <div class="row codes-row">
      <div class="mono name">${c.code}</div>
      <div><span class="lbl">Status</span>${tag(c.status)}</div>
      <div><span class="lbl">Buyer</span>${c.customer?`${esc(c.customer.name)}<div class="cell-sub">${esc(c.handler)}</div>`:'<span class="mute">—</span>'}</div>
      <div><span class="lbl">Created</span>${fmtDate(c.createdAt)}</div>
      <div><span class="lbl">Expires</span>${fmtDate(c.expiresAt)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn sm" data-copy="${c.code}">Copy</button>
        ${c.status==='not_assigned'?`<button class="btn sm pri" data-assign="${c.code}">Assign</button>`:''}
        ${c.customer?`<button class="btn sm" data-lead="${c.code}">Open</button>`:''}
        ${['not_assigned','assigned','active'].includes(c.status)?`<button class="btn sm dan" data-revoke="${c.code}">Revoke</button>`:''}
      </div>
    </div>`).join('') : '<div class="empty">No codes</div>');
}
function openAssign(code){
  openLayer(`
    <h2>Assign <span class="mono">${code}</span></h2>
    <div id="assignForm">
      <div class="field"><label>Buyer name *</label><input class="inp" name="name"></div>
      <div class="field"><label>Phone *</label><input class="inp" name="phone" inputmode="tel" placeholder="+91 "></div>
      <div class="field"><label>Handler *</label><select class="inp" name="handler">${HANDLERS.map(h=>`<option>${esc(h)}</option>`).join('')}</select></div>
      <div class="field"><label>Valid for (days)</label><input class="inp" name="days" type="number" min="1" value="${CONFIG.DEFAULT_EXPIRY_DAYS}"></div>
      <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" id="doAssign">Assign</button></div>
    </div>`, 'modal');
  const val = n=>$('#assignForm [name='+n+']').value.trim();
  $('#doAssign').onclick = ()=>{
    if (!val('name') || !val('phone')) return toast('Name and phone are required');
    const c = CODES.find(x=>x.code===code);
    c.customer = { name:val('name'), phone:val('phone') }; c.handler=val('handler');
    c.status='assigned'; c.assignedAt=Date.now(); c.expiresAt=Date.now()+(+val('days')||CONFIG.DEFAULT_EXPIRY_DAYS)*DAY;
    closeLayer(); renderCodes(); toast('Assigned to '+c.customer.name);
  };
}
function openRevoke(code){
  openLayer(`<h2>Revoke ${code}?</h2><p class="mute" style="margin-top:-6px">The buyer will no longer be able to open the site with this code.</p>
    <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn pri" style="background:var(--hot);border-color:var(--hot)" id="doRevoke">Revoke</button></div>`,'modal');
  $('#doRevoke').onclick = ()=>{ CODES.find(x=>x.code===code).status='revoked'; closeLayer(); route(); toast('Code revoked'); };
}

/* =====================================================================
   GLOBAL EVENTS + BOOT
   ===================================================================== */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-close],[data-lead],[data-unit],[data-copy],[data-assign],[data-revoke],[data-project]'); if(!t) return;
  if (t.dataset.project){ if(t.dataset.project!==CUR.id){ useProject(t.dataset.project); renderProjMini(); route(); } return; }
  if (t.dataset.close!==undefined) return closeLayer();
  if (t.dataset.lead) return openLead(t.dataset.lead);
  if (t.dataset.unit) return openUnit(t.dataset.unit);
  if (t.dataset.copy) return copy(t.dataset.copy);
  if (t.dataset.assign) return openAssign(t.dataset.assign);
  if (t.dataset.revoke) return openRevoke(t.dataset.revoke);
});

/* Run fn with another project's data loaded, then restore the current one */
function withProject(id, fn){
  const keep = { TOWERS, UNITS, UNIT_BY_ID, AVAILABLE, CODES, EVENTS, EV_BY_CODE };
  ({ TOWERS, UNITS, UNIT_BY_ID, AVAILABLE, CODES, EVENTS } = DB[id]); EV_BY_CODE = byCode();
  try{ return fn(); } finally { ({ TOWERS, UNITS, UNIT_BY_ID, AVAILABLE, CODES, EVENTS, EV_BY_CODE } = keep); }
}
function projSummary(id){
  return withProject(id, ()=>{ const L=leads();
    return { active:L.filter(l=>l.st.lastSeen && NOW-l.st.lastSeen<7*DAY).length, hot:L.filter(l=>l.band.key==='hot').length, leads:L.length }; });
}
function renderProjMini(){
  const html = `<img src="${projImg(CUR)}" alt=""><span><small>Project</small><b>${esc(CUR.name)}</b></span>`;
  ['#projMini','#projMiniM'].forEach(sel=>{ const el=$(sel); if(el) el.innerHTML=html; });
}

document.querySelectorAll('img[data-logo]').forEach(img=>img.src = img.dataset.logo==='side' ? LOGO_WHITE : LOGO_NAVY);

function boot(){
  let saved=null; try{ saved=sessionStorage.getItem('oa_project'); }catch(_){}
  useProject(saved||PROJECTS[0].id);
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  renderProjMini();
  $('#footProj').textContent = 'Signed in · mock data';
  route();
}
function tryLogin(){
  if ($('#pw').value.trim() === CONFIG.DASHBOARD_PASSWORD){ try{sessionStorage.setItem('oa_auth','1')}catch(_){}; boot(); }
  else $('#pwErr').textContent = 'Wrong password';
}
$('#loginBtn').onclick = tryLogin;
$('#pwEye').onclick = ()=>{ const i=$('#pw'), show=i.type==='password'; i.type=show?'text':'password'; $('#pwEye').textContent=show?'Hide':'Show'; i.focus(); };

/* Login illustration — three towers, lit windows (data-driven) */
const LOGIN_ART = { W:640, H:420, ground:18, towers:[
  { x:40,  w:150, floors:9,  cols:4 },
  { x:220, w:200, floors:14, cols:5 },
  { x:450, w:150, floors:11, cols:4 } ], litRatio:.32, seed:7 };
(function drawTower(){
  const A=LOGIN_ART, r=mulberry32(A.seed), floorH=(A.H-A.ground-30)/14;
  let g=`<defs><linearGradient id="lgT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4bc4"/><stop offset="1" stop-color="#14256b"/></linearGradient></defs>`;
  A.towers.forEach(t=>{
    const h=t.floors*floorH+16, y=A.H-A.ground-h, pad=12, cw=(t.w-pad*2)/t.cols;
    g+=`<rect x="${t.x}" y="${y}" width="${t.w}" height="${h}" rx="3" fill="url(#lgT)" stroke="rgba(219,229,255,.25)"/>`;
    g+=`<rect x="${t.x+t.w*.3}" y="${y-10}" width="${t.w*.4}" height="10" fill="#1a2f80"/>`;
    for(let f=0;f<t.floors;f++) for(let c=0;c<t.cols;c++){
      const on=r()<A.litRatio, d=(r()*4).toFixed(2);
      g+=`<rect class="w${on?' on':''}" x="${t.x+pad+c*cw+3}" y="${y+10+f*floorH+3}" width="${cw-6}" height="${floorH-7}" rx="1.5"${on?` style="animation-delay:${d}s"`:''}/>`;
    }
  });
  g+=`<rect x="0" y="${A.H-A.ground}" width="${A.W}" height="${A.ground}" fill="rgba(219,229,255,.15)"/>`;
  const el=$('#lgTower'); el.setAttribute('viewBox',`0 0 ${A.W} ${A.H}`); el.setAttribute('preserveAspectRatio','xMidYMax meet'); el.innerHTML=g;
})();
$('#pw').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
$('#logout').onclick = ()=>{ try{sessionStorage.removeItem('oa_auth')}catch(_){}; location.reload(); };
try{ if(sessionStorage.getItem('oa_auth')==='1') boot(); }catch(_){}
</script>
